name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Accepter les licences Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.14.3}
      - run: unzip -q FichiersBleu.zip
      - run: cd FichiersBleu && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FichiersBleu-apk
          path: FichiersBleu/app/build/outputs/apk/debug/*.apk
